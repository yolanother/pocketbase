version: '3.8'

services:
  pocketbase:
    build: .
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Main data directory - this is where your database and files are stored
      - ./pb_data:/pb/pb_data
      # Optional: Public files directory (for static file serving)
      - ./pb_public:/pb/pb_public
      # Optional: Custom hooks directory (for JavaScript hooks)
      - ./pb_hooks:/pb/pb_hooks
      # Optional: Custom migrations directory
      - ./pb_migrations:/pb/pb_migrations
    environment:
      # HTTP server address (default: 0.0.0.0:8090)
      - PB_HTTP_ADDR=0.0.0.0:8090
      # Data directory (already mounted as volume)
      - PB_DATA_DIR=/pb/pb_data
      # Hooks directory (already mounted as volume)
      - PB_HOOKS_DIR=/pb/pb_hooks
      # Migrations directory (already mounted as volume)
      - PB_MIGRATIONS_DIR=/pb/pb_migrations
      # Public directory (already mounted as volume)
      - PB_PUBLIC_DIR=/pb/pb_public
      # Optional: Encryption environment variable
      # - PB_ENCRYPTION_ENV=your_encryption_key_here
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  pb_data:
  pb_public:
  pb_hooks:
  pb_migrations:
